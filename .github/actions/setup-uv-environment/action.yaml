name: Setup Python Environment

description: Install Python and uv, and create the virtual environment

runs:
  using: "composite"
  steps:
    - name: "Set up Python"
      uses: actions/setup-python@v6
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install Python dependencies
      shell: bash
      run: uv sync
